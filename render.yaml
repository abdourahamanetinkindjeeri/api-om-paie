services:
  - type: web
    name: om-paie-api
    runtime: docker
    plan: free
    healthCheckPath: /api/documentation
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://tinkin-api-paie.onrender.com
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_URI
        value: mongodb://mongo:TyUsJXCHYKEMcEzELakgMgjBMdjEFqfv@gondola.proxy.rlwy.net:14762
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_DRIVER
        value: file
      - key: L5_SWAGGER_USE_ABSOLUTE_PATH
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
