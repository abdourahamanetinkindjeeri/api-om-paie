services:
  - type: web
    name: om-paie-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    buildFilter:
      paths:
        - app/**
        - config/**
        - routes/**
        - composer.json
        - composer.lock
        - Dockerfile
        - entrypoint.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://tinkin-transfer.onrender.com
      - key: DB_CONNECTION
        value: mongodb
      - key: MONGODB_URI
        value: mongodb://mongo:TyUsJXCHYKEMcEzELakgMgjBMdjEFqfv@gondola.proxy.rlwy.net:14762
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_DRIVER
        value: file
      - key: L5_SWAGGER_USE_ABSOLUTE_PATH
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: VIEW_COMPILED_PATH
        value: /tmp/views
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "tinkin-transfer.onrender.com"
